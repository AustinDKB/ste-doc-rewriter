[project]
name = "ste-doc-rewriter"
version = "0.1.0"
description = "Phase 1: protect → dictionary rewrite → STE lint CLI (no model)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.0",
  "pytest-cov>=5.0",
]

[project.scripts]
ste-rewrite = "ste_doc_rewriter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ste_doc_rewriter"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ste_doc_rewriter",
  "glossary",
  "schemas",
  "samples",
  "SOURCES.md",
]

[tool.pytest.ini_options]
addopts = "-n auto --cov=ste_doc_rewriter --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
